<footer class="footer">
  <div class="footer__social d-flex gap-2">
    <a href="#" class="footer__social-link btn btn-light shadow-sm rounded-circle p-2" aria-label="X (Twitter)">
      <img src="/assets/icons/x-logo.png" appImageFallback alt="X" />
    </a>
    <a href="#" class="footer__social-link btn btn-light shadow-sm rounded-circle p-2" aria-label="Instagram">
      <img src="/assets/icons/instagram.png" appImageFallback alt="Instagram" />
    </a>
    <a href="#" class="footer__social-link btn btn-light shadow-sm rounded-circle p-2" aria-label="YouTube">
      <img src="/assets/icons/youtube.png" appImageFallback alt="YouTube" />
    </a>
    <a href="#" class="footer__social-link btn btn-light shadow-sm rounded-circle p-2" aria-label="LinkedIn">
      <img src="/assets/icons/facebook.png" appImageFallback alt="Facebook" />
    </a>
  </div>

  <div class="footer__links">
    <h4 class="footer__links-title">Use cases</h4>
    @for (link of useCaseLinks; track link) {
      <a href="#" class="footer__link">{{ link }}</a>
    }
  </div>

  <div class="footer__links">
    <h4 class="footer__links-title">Explore</h4>
    @for (link of exploreLinks; track link) {
      <a href="#" class="footer__link">{{ link }}</a>
    }
  </div>

  <div class="footer__links">
    <h4 class="footer__links-title">Resources</h4>
    @for (link of resourceLinks; track link) {
      <a href="#" class="footer__link">{{ link }}</a>
    }
  </div>
</footer>
