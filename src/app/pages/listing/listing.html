<div class="container text-center">
  <div class="row">
    <div class="col" *ngFor="let item of toRender">
      <div class="card cursor-pointer mb-4" style="width: 18rem" routerLink="/listingDetail/{{item.id}}">
        <img src="{{ item.imageUrl }}" class="card-img-top" alt="{{ item.title }}" />
        <div class="card-body" >
          <h5 class="card-title">{{ item.title }}</h5>
          <p class="card-text">
            {{ item.description }}
          </p>
          <p class="card-text fw-bold">
            ${{ item.price }} per night
          </p>
        </div>
      </div>
  </div>
</div>
