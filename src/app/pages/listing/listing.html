<div class="container text-center">
  <div class="row">
    @for (item of toRender; track item.id) {
      <div class="col">
        <div class="card" style="width: 18rem">
          <img src="{{ item.imageUrl }}" class="card-img-top" alt="{{ item.title }}" />
          <div class="card-body" >
            <h5 class="card-title">{{ item.title }}</h5>
            <p class="card-text">
              {{ item.description }}
            </p>
            <a routerLink="/" class="btn btn-primary">More info</a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
