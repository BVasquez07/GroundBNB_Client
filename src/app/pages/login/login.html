<div class="v-hero-section">
    <div class="container col-xl-10 col-xxl-8 px-4 py-5">
        <div class="row align-items-center g-lg-5 py-5">
            <div class="col-lg-7 text-center text-lg-start">
                <h1 class="display-4 fw-bold lh-1 text-body-emphasis mb-3">
                    GroundBNB Login
                </h1>
                <p class="col-lg-10 fs-4">
                    Home away from home.
                </p>
            </div>
            <div class="col-md-10 mx-auto col-lg-5">
                <form (ngSubmit)="login()" class="p-4 p-md-5 rounded-3">
                    <div *ngIf="error" class="alert alert-danger mb-3" role="alert">
                        {{ error }}
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email"
                               id="email"
                               class="form-control"
                               [(ngModel)]="email"
                               name="email"
                               required
                               placeholder="Enter your email" />
                        <label for="floatingInput">Email address</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password"
                               id="password"
                               class="form-control"
                               [(ngModel)]="password"
                               name="password"
                               required
                               placeholder="Enter your password" />
                        <label for="floatingPassword">Password</label>
                    </div>
                    <div class="checkbox mb-3">
                        <label>
                            <input type="checkbox" value="remember-me" /> Remember me
                        </label>
                    </div>
                    <button class="w-100 btn btn-lg btn-primary" type="submit" [disabled]="loading">
                        Sign in
                    </button>

                    <div class="my-3 text-center text-white">
                        or
                    </div>

                    <button
                            type="button"
                            class="w-100 btn btn-lg btn-outline-light"
                            (click)="signInWithGoogle()"
                            [disabled]="loading">
                        Continue with Google
                    </button>

                    <small class="text-white">You have no account yet? Sign Up
                        <a class="text-white" routerLink="/register">here</a>.
                    </small>
                </form>
            </div>
        </div>
    </div>
</div>
