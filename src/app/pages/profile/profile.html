<div class="profile-container d-flex flex-column align-items-center">
  <div class="profile-circle shadow-sm mb-3">
    <img src="assets/headshot.jpg" 
         appImageFallback 
         class="profile-img" 
         alt="User Profile">
  </div>
  
  <h3 class="h5 fw-bold mb-0">Kumalala</h3>
  <p class="text-muted small">Host since 2026</p>
</div>

<div class="container text-center">
    <div class="row">
        <div class="col" *ngFor="let item of pastExperienceReviews">
            <div class="card" style="width: 18rem;">
                <img src="{{ item.Image }}" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">{{ item.experienceTitle }}</h5>
                    <a *ngIf="!item.gaveRating"  class="btn btn-primary">Give Rating</a>
                    <p class="card-text fw-bold">${{ item.price }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
